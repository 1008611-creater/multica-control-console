</main>

function chirp(){if(!soundOn||paused||!audio||audio.state!=='running')return;const n=audio.currentTime;for(let i=0;i<3;i++){const osc=audio.createOscillator(),gain=audio.createGain();osc.type='sine';const start=n+i*.13;osc.frequency.setValueAtTime(2300+i*170,start);osc.frequency.exponentialRampToValueAtTime(3600+i*130,start+.045);osc.frequency.exponentialRampToValueAtTime(2600,start+.1);gain.gain.setValueAtTime(0,start);gain.gain.linearRampToValueAtTime(.07,start+.018);gain.gain.exponentialRampToValueAtTime(.0001,start+.11);osc.connect(gain);gain.connect(master);osc.start(start);osc.stop(start+.12)}}
async function toggleSound(){try{if(!audio){const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio){notify('这个浏览器暂不支持自然音。');return}audio=new Audio();master=audio.createGain();master.gain.value=0;master.connect(audio.destination);const len=audio.sampleRate*3,buffer=audio.createBuffer(1,len,audio.sampleRate),data=buffer.getChannelData(0);let brown=0;const noiseRand=rng(31);for(let i=0;i<len;i++){brown=(brown+(noiseRand()*2-1)*.02)/1.02;data[i]=brown*2.4}const noise=audio.createBufferSource();noise.buffer=buffer;noise.loop=true;const filter=audio.createBiquadFilter();filter.type='lowpass';filter.frequency.value=570;const wind=audio.createGain();wind.gain.value=.2;noise.connect(filter);filter.connect(wind);wind.connect(master);noise.start();birdTimer=setInterval(chirp,3900)}await audio.resume();soundOn=!soundOn;master.gain.setTargetAtTime(soundOn&&!paused?.22:0,audio.currentTime,.5);document.getElementById('soundIcon').innerHTML=soundOn?'<path d="m11 5-6 4H2v6h3l6 4ZM15 8q5 4 0 8M18 5q8 7 0 14"/>':'<path d="m11 5-6 4H2v6h3l6 4ZM16 9l5 6m0-6-5 6"/>';const b=document.getElementById('sound');b.setAttribute('aria-pressed',String(soundOn));b.title=b.ariaLabel=soundOn?'关闭自然音':'开启自然音';if(soundOn){chirp();notify('听，风和小鸟也在。')}}catch{notify('声音暂时无法开启，风景仍在。')}}
